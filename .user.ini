; Custom PHP configuration for Laravel LMS
; These settings will override the default PHP configuration

; File upload settings
upload_max_filesize = 5120M
post_max_size = 5120M
max_file_uploads = 20

; Execution time limits
max_execution_time = 1800
max_input_time = 1800

; Memory limits
memory_limit = 512M

; Input limits
max_input_vars = 3000
max_input_nesting_level = 64

; Session settings
session.gc_maxlifetime = 7200

; Error reporting for development
display_errors = On
log_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED